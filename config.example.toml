# 外部触发控制接口。固定只监听 127.0.0.1，供本机工具调用。
# port 可改成其他本机端口；重新加载配置时会先尝试绑定新端口。
# 可用命令：asr-evo-control start | stop | toggle | status。
[control]
port = 8765

# macOS 和 Windows 内置全局快捷键配置，也可用外部工具调用 asr-evo-control。
# toggle 使用 ctrl+alt+space 这类写法。
# mode = "toggle" 表示按一次切换；mode = "hold" 表示按下开始、释放停止。
[hotkey]
enabled = true
toggle = "ctrl+alt+space"
mode = "toggle"

# Linux 由桌面/合成器绑定 asr-evo-control，不注册内置全局快捷键。
# standard 显示普通托盘；waybar 配合 examples/linux/waybar.jsonc。切换后重启。
[linux]
paste_shortcut = "ctrl+v" # 终端通常使用 ctrl+shift+v
tray = "standard"

# 语音识别服务配置。api_key_env 指向 .env 中保存密钥的变量名。
[asr]
backend = "openai" # 另可选 qwen_local、dashscope_filetrans、dashscope_message（见 docs/MESSAGE.md）
model = "qwen3-asr-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"

# 文本润色模型配置。每个 profile 都可使用不同服务、模型和密钥变量。
# 模板通过 llm_profile 选择别名；未指定时使用 default_profile。
[llm]
# 实时、非实时统一的自动润色开关；关闭后仍可在确认窗口点击“润色一次”。
auto_polish = true
default_profile = "balanced"

[llm.profiles.fast]
backend = "openai" # 本地 LLM 可用 ollama，base_url 填 http://127.0.0.1:11434
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
enable_thinking = false

[llm.profiles.balanced]
backend = "openai"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
enable_thinking = true

# 内置“技术记录”和“博客文章”模板引用 deep。
[llm.profiles.deep]
backend = "openai"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
enable_thinking = true

# 提示词风格配置。所有风格都来自 prompts_dir 目录中的 .md 文件。
# 风格 id 是提示词文件名去掉扩展名，例如 通用润色.md 对应 通用润色。
# 子文件夹会显示为子菜单，例如 写作/邮件.md 对应 写作/邮件。
[style]
mode = "通用润色"
prompts_dir = "prompts"
# 按应用绑定风格，key 是 bundle id，value 是风格 id。
# 示例：{ "com.apple.TextEdit" = "通用润色", "md.obsidian" = "会议纪要", "com.apple.mail" = "写作/邮件" }
[style.app_styles]

# 润色上下文配置。开启后，最近听写记录会作为上下文发给 LLM，用于更连贯地润色。
[context]
enabled = true
# 超过这个时间的历史记录不会继续作为上下文传给 LLM。
ttl_seconds = 600
# 最多传入多少条近期听写记录。
max_items = 20
# 最多传入多少个上下文字数。
max_chars = 6000
# 上下文范围：app 表示同一应用，window 表示同一窗口，time 表示仅按时间。
scope = "app"

# 用户确认配置。开启后，润色结果会先显示在文本框中，
# 确认后再记录用户最终文本并插入到当前光标处。
[review]
enabled = true
# 实时模式独立使用 realtime_asr；开启后开始录音即显示确认窗口。
realtime_enabled = false
polish_interval_seconds = 5.0

# 录音输入配置。input_device 为空表示跟随系统默认输入设备。
# 也可以填写 sounddevice 设备编号；在托盘菜单切换后会自动保存。
[audio]
input_device = ""
# 开启需安装 RNNoise 0.2+ 系统库；默认关闭，不改变现有录音音量。
noise_suppression = false
input_gain_db = 0.0
# 1.0 为完整降噪，0.85 保留 15% 对齐原声以减少弱音吞字。
denoise_mix = 0.85

# 状态栏图标和提示文字。symbol 目前由 macOS 映射到 SF Symbols；Windows 托盘使用内置状态图标和这些提示文字。
[status]
idle_symbol = "mic"
recording_symbol = "record.circle"
transcribing_symbol = "waveform"
polishing_symbol = "text.alignleft"
inserting_symbol = "text.insert"
reviewing_symbol = "square.and.pencil"
error_symbol = "exclamationmark.triangle"
idle_text = "空闲"
recording_text = "正在录音"
transcribing_text = "正在转写"
polishing_text = "正在润色"
reviewing_text = "等待确认文本"
inserting_text = "正在插入"
error_text = "错误"

# 调试配置。开启后会把调试快照打印到 stderr。
# Authorization 会自动脱敏；音频 base64 默认只显示长度摘要。
[debug]
dump_remote_requests = false
# 设为 true 会打印完整大字段，例如音频 base64；只建议临时排查时开启。
include_large_request_values = false
# 普通字符串超过这个长度会被截断。
max_request_value_chars = 4000

# 实时 ASR 专用接口，不能使用普通 ASR 的 HTTP 文件转写接口。
# 完整云端、本地 Qwen3-ASR-0.6B（vLLM）示例见 docs/REALTIME.md。
[realtime_asr]
backend = "disabled" # disabled / dashscope / qwen_local
url = "wss://dashscope.aliyuncs.com/api-ws/v1/realtime"
model = "qwen3-asr-flash-realtime"
api_key_env = "ASR_REALTIME_API_KEY"
language = ""
python_executable = ""
chunk_size_seconds = 2.0
gpu_memory_utilization = 0.5
timeout_seconds = 600
